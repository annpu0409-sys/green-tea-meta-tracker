<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>綠綠茶 Meta 貼文時程與進度追蹤</title>
<style>
:root{--bg:#f6f8f5;--surface:#ffffff;--ink:#1d2a22;--muted:#5d6b62;--line:#dde4dd;--c1:#9cc9a6;--c2:#4f9a68;--c3:#e0a93b;--c4:#1d5b3a;--accent:#1d5b3a;--sel:#eaf3ec;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--surface:#1b2a22;--ink:#e6efe8;--muted:#9fb0a5;--line:#2c3f34;--c1:#3f7a54;--c2:#5fb07c;--c3:#d9a441;--c4:#8fd4a6;--accent:#8fd4a6;--sel:#22362a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201a;--surface:#1b2a22;--ink:#e6efe8;--muted:#9fb0a5;--line:#2c3f34;--c1:#3f7a54;--c2:#5fb07c;--c3:#d9a441;--c4:#8fd4a6;--accent:#8fd4a6;--sel:#22362a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}h1{font-size:24px;margin:0 0 4px;letter-spacing:.02em}.sub{color:var(--muted);margin:0 0 16px}.top{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.prog{flex:1;min-width:240px}.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}.stat{font-size:13px;color:var(--muted);margin-top:4px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.inner{min-width:2300px}.cc{flex:0 0 290px;padding:8px;border-left:1px solid var(--line)}.cc textarea{min-height:96px}.hh{font-weight:600;padding:8px 12px}.drop{border:2px dashed var(--line);border-radius:8px;padding:10px;font-size:12px;color:var(--muted);text-align:center}.row{display:flex;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.info{flex:0 0 280px;position:sticky;left:0;z-index:2;background:var(--surface);padding:10px 12px;border-right:1px solid var(--line)}.info b{display:block;font-weight:600}.meta{font-size:12px;color:var(--muted)}.chk{display:flex;gap:12px;margin-top:6px;font-size:12px}.chk label{display:flex;align-items:center;gap:4px}.track{position:relative;flex:1;min-height:70px}.hdr .info{font-weight:600;padding:8px 12px}.hdr .track{min-height:36px}.m{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:12px;color:var(--muted);padding:8px 6px}.row:not(.hdr) .m{padding:0;font-size:0}.seg{position:absolute;height:14px;border-radius:7px;background:var(--c)}.pub{position:absolute;width:16px;height:16px;transform:rotate(45deg);background:var(--c4);border-radius:3px}.lbl{position:absolute;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}.row.done{background:var(--sel)}.row.done .info{background:var(--sel)}.row.next .info{box-shadow:inset 4px 0 0 var(--c3)}.tag{display:inline-block;font-size:11px;padding:0 6px;border:1px solid var(--line);border-radius:9px;margin-left:6px;color:var(--muted)}.today{position:absolute;top:0;bottom:0;width:2px;background:#d4493c;z-index:1}.note{margin-top:16px;font-size:13px;color:var(--muted)}h2{font-size:18px;margin:28px 0 12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}.card h3{margin:0 0 2px;font-size:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}@media(max-width:700px){.two{grid-template-columns:1fr}}.card label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}textarea{width:100%;min-height:120px;resize:vertical;font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}textarea:disabled{opacity:1}.imgs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.imgs img{height:90px;max-width:170px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}.cta a,.meta a{color:var(--accent)}.image-note{font-size:12px;color:var(--muted)}.status-error{color:#bf3b32!important}.status-ok{color:var(--accent)!important}
</style>
</head>
<body>
<main>
<h1>綠綠茶 Meta 貼文時程與進度追蹤</h1>
<p class="sub">2026/12/15 – 2027/12/15，共 13 檔貼文。每檔以發文日回推製作時程，進度由雲端同步顯示。</p>
<div class="top"><div class="prog"><div class="bar"><i id="pb"></i></div><div class="stat" id="st">等待雲端資料…</div></div><span class="stat" id="mode" role="status" aria-live="polite">正在初始化…</span></div>
<div class="legend"><span style="--c:var(--c1)">企劃／文案撰寫（發文前 5 週 → 3 週）</span><span style="--c:var(--c2)">素材製作（4 週 → 1.5 週）</span><span style="--c:var(--c3)">內部／萬家福確認（10 → 3 天前）</span><span style="--c:var(--c4)">◆ 發文日</span></div>
<div class="wrap"><div class="inner" id="g"></div></div>
<h2>各檔貼文規劃與素材</h2><div id="cards"></div>
<p class="note">左側黃色標記為下一檔待處理貼文，紅線為今天。所有訪客皆為唯讀；請由 Supabase 後台更新勾選狀態、文案、素材說明與圖片清單。雲端連線正常時，資料更新會同步到開啟中的網頁。</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";
// ★ 請填入你自己 Supabase 專案的公開連線資訊（勿填 secret/service_role key）
const SUPABASE_URL = "https://zynzunitrqtnaidldrpf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_0ZoYQ9j3I-clfsS03ABr_A_cvVYCfIM";
const STORAGE_BUCKET = "meta-assets";
const P=[
["2026-12-15","新品上市","PLAZA","建立新品上市露出"],
["2027-01-15","新品上市試飲會宣傳","門市","提升活動參與度"],
["2027-02-15","試飲活動回顧／產品特色","門市","延續活動熱度"],
["2027-03-15","日常飲用情境","PLAZA","建立日常飲用需求"],
["2027-04-15","產品特色深入介紹","PLAZA","加深商品理解"],
["2027-05-15","日常分享／飲用提案","PLAZA","增加互動與好感"],
["2027-06-15","年中購物節／商品導購","門市","配合通路促銷"],
["2027-07-15","夏日愛飲季活動","PLAZA","掌握夏季需求"],
["2027-08-15","產品 Q&A／夏季特調資訊","PLAZA","提升商品認知"],
["2027-09-15","中秋聚會／烤肉搭配","門市","結合節慶情境"],
["2027-10-15","商品印象再強化","PLAZA","維持商品關注度"],
["2027-11-15","雙 11 購物節／促購導流","門市","提高購買轉換"],
["2027-12-15","年末商品推薦","門市","提高購買轉換"]];
const X=[
["介紹新品綠綠茶、上市資訊（獨家販售規格）｜商品主視覺、包裝照、主打「日式茶飲首選」","IRIS OHAYAMA 綠綠茶品項介紹|https://www.irisohyamatw.com/pages/feature-tea-ryoku"],
["公告試飲日期、地點、參與方式｜活動主視覺、活動資訊、門市照片","活動資訊頁／指定門市資訊"],
["分享活動照片、消費者體驗與商品特色｜活動花絮、試飲照片、商品亮點","門市資訊"],
["居家、辦公、休息時的飲用情境｜生活情境照、日常飲用文案","門市資訊"],
["茶飲風味、規格、包裝資訊｜商品細節圖、特色 banner、常見問題","IRIS OHAYAMA 綠綠茶品項介紹|https://www.irisohyamatw.com/pages/feature-tea-ryoku"],
["搭配茶飲的日常情境與餐食｜茶飲搭配、餐食情境、互動式文案","IRIS OHAYAMA 綠綠茶品項介紹|https://www.irisohyamatw.com/pages/feature-tea-ryoku"],
["結合萬家福年中檔期優惠與商品推薦｜檔期主視覺、優惠資訊、商品圖","門市資訊"],
["夏日、冰飲、清爽飲用情境｜冰飲情境照、夏季主視覺、清爽文案","愛飲季活動頁"],
["商品規格、飲用與保存方式｜Q&A banner、商品資訊整理","門市資訊"],
["家庭聚會、烤肉、餐食搭配｜中秋情境照、茶飲搭餐圖、節慶文案","門市資訊"],
["回顧商品特色與日常飲用情境｜商品主視覺、特色整理 banner","門市資訊"],
["雙 11 優惠與購買誘因｜檔期優惠圖、商品推薦圖、促購文案","門市資訊"],
["年度商品亮點搭配冬季與年末情境｜年度回顧圖、商品特色整理、年末推薦文案","門市資訊"]];
const D=864e5,S=Date.UTC(2026,10,10),E=Date.UTC(2027,11,31),T=E-S;
const pct=t=>(t-S)/T*100;
const ts=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};
const g=document.getElementById("g"),cards=document.getElementById("cards"),mode=document.getElementById("mode");
let st={},client=null,loaded=false,subscription=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
function months(){let h="";for(let y=2026,m=10;;){const t=Date.UTC(y,m,1);if(t>E)break;h+=`<div class="m" style="left:${Math.max(0,pct(t))}%">${y}/${m+1}</div>`;m++;if(m>11){m=0;y++}}return h}
function mlines(){let h="";for(let y=2026,m=11;;){const t=Date.UTC(y,m,1);if(t>E)break;h+=`<div class="m" style="left:${pct(t)}%"></div>`;m++;if(m>11){m=0;y++}}return h}
function todayLine(){const now=Date.now();return now>=S&&now<=E?`<div class="today" style="left:${pct(now)}%"></div>`:""}
function renderLayout(){const tl=todayLine();let html=`<div class="row hdr"><div class="info">貼文</div><div class="track">${months()}${tl}</div><div class="cc hh">文案</div><div class="cc hh">素材</div></div>`;
P.forEach((p,i)=>{const d=ts(p[0]),seg=(a,b,c)=>`<div class="seg" style="left:${pct(d-a*D)}%;width:${(a-b)*D/T*100}%;top:${c}px;--c:var(--c${c===10?1:c===26?2:3})"></div>`;
html+=`<div class="row" id="r${i}"><div class="info"><b>${p[0].replace(/-/g,"/")} ${esc(p[1])}<span class="tag">${esc(p[2])}</span></b><div class="meta">${esc(p[3])}<span class="ct"></span></div><div class="chk">${[["w","文案確認"],["a","素材確認"],["p","已發文"]].map(([k,n])=>`<label><input type="checkbox" disabled data-i="${i}" data-k="${k}">${n}</label>`).join("")}</div></div><div class="track">${mlines()}${tl}${seg(35,21,10)}${seg(28,11,26)}${seg(10,3,42)}<div class="pub" style="left:calc(${pct(d)}% - 8px);top:10px"></div><div class="lbl" style="left:calc(${pct(d)}% + 14px);top:8px">${p[0].slice(5).replace("-","/")}</div></div><div class="cc"><textarea disabled data-i="${i}" data-k="copy" placeholder="尚未提供文案"></textarea></div><div class="cc"><div class="drop">素材圖片（由管理者在 Supabase 上傳）</div><div class="imgs"></div><div class="image-note">尚未提供圖片</div></div></div>`});g.innerHTML=html;
cards.innerHTML=P.map((p,i)=>{const [label,url]=X[i][1].split("|");return `<section class="card" id="c${i}"><h3>${p[0].replace(/-/g,"/")} ${esc(p[1])}</h3><div class="meta">規劃方向：${esc(X[i][0])}</div><div class="two"><div><label>文案</label><textarea disabled data-i="${i}" data-k="copy" placeholder="尚未提供文案"></textarea></div><div><label>素材（雲端連結或說明）</label><textarea disabled data-i="${i}" data-k="mat" placeholder="尚未提供素材說明"></textarea><div class="imgs"></div></div></div><div class="meta cta">CTA：${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:esc(label)}</div></section>`}).join("")}
function imagePaths(s){return Array.isArray(s.imgs)?s.imgs.filter(x=>typeof x==="string"&&x.length>0):[]}
function imageHtml(paths){return paths.map(path=>{if(!client)return "";const {data}=client.storage.from(STORAGE_BUCKET).getPublicUrl(path);const url=data.publicUrl;return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer"><img src="${esc(url)}" loading="lazy" alt="貼文素材圖片"></a>`}).join("")}
function paint(){let done=0,next=-1,count=0;
P.forEach((p,i)=>{const s=st[i]||{};["w","a","p"].forEach(k=>{const el=g.querySelector(`[data-i="${i}"][data-k="${k}"]`);el.checked=!!s[k]});const r=document.getElementById("r"+i);r.classList.toggle("done",!!s.p);r.classList.remove("next");if(s.p)done++;else if(next<0)next=i;count+=Number(!!s.w)+Number(!!s.a)+Number(!!s.p);
const copy=s.copy||"",mat=s.mat||"";g.querySelector(`#r${i} textarea[data-k="copy"]`).value=copy;cards.querySelector(`#c${i} textarea[data-k="copy"]`).value=copy;cards.querySelector(`#c${i} textarea[data-k="mat"]`).value=mat;const paths=imagePaths(s),imgs=imageHtml(paths);g.querySelector(`#r${i} .imgs`).innerHTML=imgs;cards.querySelector(`#c${i} .imgs`).innerHTML=imgs;g.querySelector(`#r${i} .image-note`).textContent=paths.length?`共 ${paths.length} 張素材圖片`:"尚未提供圖片";g.querySelector(`#r${i} .ct`).innerHTML=` ｜<a href="#c${i}">文案${copy?"✔":"○"} 素材${paths.length||mat?"✔":"○"}</a>`});
if(next>=0)document.getElementById("r"+next).classList.add("next");document.getElementById("pb").style.width=(count/39*100)+"%";document.getElementById("st").textContent=loaded?`已發文 ${done}/13　整體進度 ${Math.round(count/39*100)}%`+(next>=0?`　下一檔：${P[next][0].replace(/-/g,"/")} ${P[next][1]}`:"　全部完成"):"等待雲端資料…"}
function setStatus(message,error=false){mode.textContent=message;mode.classList.toggle("status-error",error);mode.classList.toggle("status-ok",!error)}
async function loadProgress(){if(!client)return;const {data,error}=await client.from("meta_post_progress").select("id,copy_done,asset_done,published,copy,mat,imgs").order("id");if(error){console.error(error);setStatus("讀取失敗：請確認資料表欄位及公開讀取權限",true);return}const next={};for(const row of data){next[row.id]={w:row.copy_done,a:row.asset_done,p:row.published,copy:row.copy||"",mat:row.mat||"",imgs:row.imgs||[]}}st=next;loaded=true;paint();setStatus("雲端資料已載入｜唯讀模式")}
async function init(){renderLayout();paint();if(!window.supabase){setStatus("Supabase 套件載入失敗，請檢查網路",true);return}if(!/^https:\/\/.+\.supabase\.co\/?$/.test(SUPABASE_URL)||SUPABASE_PUBLISHABLE_KEY.startsWith("請填入")){setStatus("請先在 HTML 填入 Project URL 與 Publishable Key",true);return}
try{client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);await loadProgress();subscription=client.channel("green-tea-meta-progress").on("postgres_changes",{event:"*",schema:"public",table:"meta_post_progress"},()=>{loadProgress()}).subscribe(status=>{if(status==="SUBSCRIBED"&&loaded)setStatus("即時同步已連線｜唯讀模式");else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED")setStatus("即時連線中斷，請重新整理網頁",true)});document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadProgress()});window.addEventListener("online",()=>loadProgress())}catch(error){console.error(error);setStatus("連線設定錯誤，請檢查 URL 與公開金鑰",true)}}
init();
</script>
</body>
</html>
